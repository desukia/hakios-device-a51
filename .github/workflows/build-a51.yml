name: Build HakiOS iOS 16.5 for Samsung Galaxy A51 (SM-A515F)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Device target'
        required: true
        default: 'a51'
      build_recovery:
        description: 'Build Odin recovery .tar.md5'
        required: true
        type: boolean
        default: true
  push:
    branches: [ main, master ]

jobs:
  build-hakios:
    name: Compile HakiOS Kernel, UEFI and iOS 16.5 Userland
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Device Repository (hakios-device-a51)
        uses: actions/checkout@v4
        with:
          path: device-a51

      - name: Free Disk Space on Runner
        run: |
          echo "=== Espaço em disco antes da limpeza ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af || true
          echo "=== Espaço em disco após limpeza ==="
          df -h

      - name: Install Toolchain and Build Dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld bison flex \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler libssl-dev libelf-dev bc cpio \
            kmod curl wget unzip xz-utils git python3 python3-pip \
            python3-setuptools python3-wheel 7zip lz4 util-linux \
            mono-devel ca-certificates-mono nasm uuid-dev
          pip3 install --break-system-packages edk2-pytool-extensions edk2-pytool-library lzfse

          # Setup nuget wrapper com Mono para o Project Mu (necessário no Ubuntu 24.04)
          sudo curl -sSL -o /usr/local/bin/nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          printf '#!/bin/sh\nexec mono /usr/local/bin/nuget.exe "$@"\n' | sudo tee /usr/local/bin/nuget
          sudo chmod +x /usr/local/bin/nuget

          echo "CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Setup Theos Toolchain and iOS 16.5 SDK
        run: |
          echo "=== Configurando Theos com cctools e SDK iPhoneOS 16.5 ==="
          mkdir -p $HOME/theos/toolchain/linux/iphone
          curl -LO https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          tar -xf linux-ios-arm64e-clang-toolchain.tar.lzma -C $HOME/theos/toolchain/linux/iphone/
          rm -f linux-ios-arm64e-clang-toolchain.tar.lzma

          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p $HOME/theos/sdks
          cp -r /tmp/theos-sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/
          rm -rf /tmp/theos-sdks

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Clone HakiOS Common Repository and Integrate A51
        run: |
          git clone --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios-tree
          mkdir -p hakios-tree/devices/a51
          cp -r device-a51/* hakios-tree/devices/a51/
          
          echo "=== Aplicando patches necessários para Galaxy A51 ==="
          chmod +x device-a51/scripts/patch-hakios-for-a51.sh
          bash device-a51/scripts/patch-hakios-for-a51.sh hakios-tree

      - name: Download iOS 16.5 (20F66) IPSW from Apple CDN
        working-directory: hakios-tree
        run: |
          IPSW_URL="https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-85130/6AB0D10A-8AF9-4F6C-8CF5-A1B315CABE88/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
          IPSW_FILE="iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
          echo "Baixando IPSW oficial do iOS 16.5 (~5.7 GB)..."
          curl -C - -L -o "$IPSW_FILE" "$IPSW_URL"
          ls -lh "$IPSW_FILE"

      - name: Unpack IPSW System Images
        working-directory: hakios-tree
        run: |
          umask 022
          make unpack IPSW="iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"

      - name: Setup Mu-Silicium and Build UEFI for Galaxy A51
        working-directory: hakios-tree
        run: |
          echo "=== Clonando Mu-Silicium (Project-Silicium) ==="
          git clone --depth 1 --recurse-submodules https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium || git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          
          echo "=== Copiando arquivos UEFI do A51 para Mu-Silicium ==="
          cp -r devices/a51/uefi/files/* Mu-Silicium/
          
          cd Mu-Silicium
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          if [ -f pip-requirements.txt ]; then
            pip3 install --break-system-packages -r pip-requirements.txt || true
          fi
          python3 build_uefi.py -d a51 -u || python3 build_uefi.py -d a51 || echo "[!] Finalizando passo UEFI..."
          cd ..

      - name: Configure Defconfig and Compile Kernel & Loader
        working-directory: hakios-tree
        run: |
          echo "=== Configurando defconfig a51 ==="
          make a51_defconfig
          
          echo "=== Compilando xnuloader ==="
          make loader
          
          echo "=== Compilando kernel XNU para A51 ==="
          make kernel

      - name: Build Flashboot Userland Image
        working-directory: hakios-tree
        run: |
          umask 022
          QUIET=1 GL=1 CRYPTEXES=flash FLASHBOOT=1 REST=1 userland/build.sh

      - name: Package Odin Recovery Image (.tar.md5)
        working-directory: hakios-tree
        run: |
          mkdir -p out
          python3 mkxnuimg.py --device a51 -o out/recovery.img
          
          if [ -f out/recovery.img ]; then
            cd out
            tar -H ustar -c recovery.img > hakios-a51-fb2-RECOVERY.tar
            md5sum -t hakios-a51-fb2-RECOVERY.tar >> hakios-a51-fb2-RECOVERY.tar
            mv hakios-a51-fb2-RECOVERY.tar hakios-a51-fb2-RECOVERY.tar.md5
            ls -lh hakios-a51-fb2-RECOVERY.tar.md5
            cd ..
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-a51-recovery-odin
          path: |
            hakios-tree/out/*
            hakios-tree/build/*
            hakios-tree/userland/*.apfs
          if-no-files-found: warn
