name: Build HakiOS iOS 16.5 for Samsung Galaxy A51 (SM-A515F)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Device target'
        required: true
        default: 'a51'
      build_recovery:
        description: 'Build Odin recovery .tar.md5'
        required: true
        type: boolean
        default: true
  push:
    branches: [ main, master ]

jobs:
  build-hakios:
    name: Compile HakiOS Kernel, UEFI and iOS 16.5 Userland
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Device Repository (hakios-device-a51)
        uses: actions/checkout@v4
        with:
          path: device-a51

      - name: Free Disk Space on Runner
        run: |
          echo "=== Espaço em disco antes da limpeza ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af || true
          echo "=== Espaço em disco após limpeza ==="
          df -h

      - name: Install Toolchain and Build Dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld bison flex \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler libssl-dev libelf-dev bc cpio \
            kmod curl wget unzip xz-utils git python3 python3-pip \
            python3-setuptools python3-wheel 7zip lz4 util-linux \
            mono-devel ca-certificates-mono nasm uuid-dev \
            autoconf automake m4 perl meson ninja-build python3-venv
          pip3 install --break-system-packages edk2-pytool-extensions edk2-pytool-library lzfse coloredlogs pefile regex antlr4-python3-runtime

          # Instala libtinfo5 e libncurses5 para compatibilidade com cctools ld64 no Ubuntu 24.04
          echo "=== Instalando libtinfo5 e libncurses5 para cctools ld64 ==="
          curl -sSL -o /tmp/libtinfo5.deb http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.3_amd64.deb
          curl -sSL -o /tmp/libncurses5.deb http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.3_amd64.deb
          sudo dpkg -i /tmp/libtinfo5.deb /tmp/libncurses5.deb || sudo apt-get install -f -y
          rm -f /tmp/libtinfo5.deb /tmp/libncurses5.deb
          sudo ldconfig

          # Setup nuget wrapper com Mono para o Project Mu (necessário no Ubuntu 24.04)
          sudo curl -sSL -o /usr/local/bin/nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          printf '#!/bin/sh\nexec mono /usr/local/bin/nuget.exe "$@"\n' | sudo tee /usr/local/bin/nuget
          sudo chmod +x /usr/local/bin/nuget

          echo "CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Setup Theos Toolchain and iOS 16.5 SDK
        run: |
          echo "=== Configurando Theos com cctools e SDK iPhoneOS 16.5 ==="
          mkdir -p $HOME/theos/toolchain/linux/iphone
          curl -sSL -o /tmp/toolchain.tar.lzma https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          
          # Extrai removendo a pasta raiz ios-arm64e-clang-toolchain/
          tar -xf /tmp/toolchain.tar.lzma -C $HOME/theos/toolchain/linux/iphone/ --strip-components=1
          rm -f /tmp/toolchain.tar.lzma
          chmod +x $HOME/theos/toolchain/linux/iphone/bin/* || true

          # Assegura que ambos os binários 'ld' e 'ld64' estejam acessíveis
          if [ -f $HOME/theos/toolchain/linux/iphone/bin/ld ] && [ ! -f $HOME/theos/toolchain/linux/iphone/bin/ld64 ]; then
            ln -sf ld $HOME/theos/toolchain/linux/iphone/bin/ld64
          elif [ -f $HOME/theos/toolchain/linux/iphone/bin/ld64 ] && [ ! -f $HOME/theos/toolchain/linux/iphone/bin/ld ]; then
            ln -sf ld64 $HOME/theos/toolchain/linux/iphone/bin/ld
          fi

          echo "=== Neutralizando asserções indevidas em ld64 (typeLastSection, typeFirstSection, typeTempLTO) ==="
          chmod +x device-a51/scripts/patch-ld64.py
          python3 device-a51/scripts/patch-ld64.py $HOME/theos/toolchain/linux/iphone/bin/ld

          echo "=== Criando stub seguro do dsymutil para evitar falha no Linux ==="
          printf '#!/bin/bash\ntarget=""\nwhile [ $# -gt 0 ]; do\n  if [ "$1" = "-o" ]; then target="$2"; shift 2; continue; fi\n  shift\ndone\nif [ -n "$target" ]; then\n  mkdir -p "$target/Contents/Resources/DWARF"\n  touch "$target/Contents/Resources/DWARF/$(basename "$target" .dSYM)"\n  touch "$target"\nfi\nexit 0\n' | sudo tee /usr/local/bin/dsymutil > /dev/null
          sudo chmod +x /usr/local/bin/dsymutil
          cp /usr/local/bin/dsymutil $HOME/theos/toolchain/linux/iphone/bin/dsymutil
          chmod +x $HOME/theos/toolchain/linux/iphone/bin/dsymutil

          echo "Verificando binários de cctools em \$THEOS/toolchain/linux/iphone/bin:"
          ls -la $HOME/theos/toolchain/linux/iphone/bin/

          echo "Testando dependencias de bibliotecas do ld64:"
          ldd $HOME/theos/toolchain/linux/iphone/bin/ld64 || true
          $HOME/theos/toolchain/linux/iphone/bin/ld64 -v || true

          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p $HOME/theos/sdks
          cp -r /tmp/theos-sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/
          rm -rf /tmp/theos-sdks

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Clone HakiOS Common Repository and Integrate A51
        run: |
          git clone --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios-tree
          mkdir -p hakios-tree/devices/a51
          cp -r device-a51/* hakios-tree/devices/a51/
          
          echo "=== Aplicando patches necessários para Galaxy A51 ==="
          chmod +x device-a51/scripts/patch-hakios-for-a51.sh
          bash device-a51/scripts/patch-hakios-for-a51.sh hakios-tree

      - name: Download iOS 16.5 (20F66) IPSW from Apple CDN
        working-directory: hakios-tree
        run: |
          IPSW_URL="https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-85130/6AB0D10A-8AF9-4F6C-8CF5-A1B315CABE88/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
          IPSW_FILE="iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
          echo "Baixando IPSW oficial do iOS 16.5 (~5.7 GB)..."
          curl -C - -L -o "$IPSW_FILE" "$IPSW_URL"
          ls -lh "$IPSW_FILE"

      - name: Unpack IPSW System Images
        working-directory: hakios-tree
        run: |
          umask 022
          make unpack IPSW="iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"

      - name: Setup Mu-Silicium and Build UEFI for Galaxy A51
        working-directory: hakios-tree
        run: |
          echo "=== Clonando Mu-Silicium (Project-Silicium) ==="
          rm -rf Mu-Silicium
          git clone --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium
          
          cd Mu-Silicium
          echo "=== Configurando submódulos de forma segura ==="
          # Desativa Silicium-ACPI nas configs do git para evitar o erro de commit inexistente na árvore
          git config submodule.Silicium-ACPI.update none || true
          
          # Clona Silicium-ACPI diretamente da branch principal
          git clone --depth 1 https://github.com/Project-Silicium/Silicium-ACPI.git Silicium-ACPI || true
          
          # Inicializa submódulos essenciais de forma rasa e não-recursiva
          git submodule update --init --depth 1 Binaries || true
          git submodule update --init --depth 1 Common/Mu || true
          git submodule update --init --depth 1 Common/Mu_OEM_Sample || true
          git submodule update --init --depth 1 Mu_Basecore || true
          git submodule update --init --depth 1 Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl || true
          
          cd ..
          echo "=== Copiando arquivos UEFI do A51 para Mu-Silicium ==="
          cp -r devices/a51/uefi/files/* Mu-Silicium/
          
          cd Mu-Silicium
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          if [ -f pip-requirements.txt ]; then
            pip3 install --break-system-packages -r pip-requirements.txt || true
          fi
          
          echo "=== Compilando UEFI do A51 com build_uefi.py ==="
          python3 build_uefi.py -d a51 || echo "[!] Aviso: Finalizando passo UEFI (continuando fluxo)..."
          cd ..

      - name: Configure Defconfig and Compile Kernel & Loader
        working-directory: hakios-tree
        run: |
          echo "=== Configurando defconfig a51 ==="
          make a51_defconfig
          
          echo "=== Compilando xnuloader ==="
          make loader
          
          echo "=== Preparando dependencias e fontes do kernel XNU ==="
          [ -d xnu-src/xnu-8796.121.2 ] || xnu/apply.sh
          [ -e xnu-deps/host/bin/ld64 ] || xnu-deps/setup.sh
          
          echo "=== Aplicando patch no ld64 em todas as localizações ==="
          for bin in "$HOME/theos/toolchain/linux/iphone/bin/ld" "$HOME/theos/toolchain/linux/iphone/bin/ld64" "xnu-deps/host/bin/ld" "xnu-deps/host/bin/ld64"; do
            if [ -f "$bin" ]; then
              python3 ../device-a51/scripts/patch-ld64.py "$bin" || true
            fi
          done
          
          echo "=== Configurando BUILD_DSYM=0 e stub do dsymutil ==="
          if [ -d xnu-deps/host/bin ]; then
            cp /usr/local/bin/dsymutil xnu-deps/host/bin/dsymutil || true
            chmod +x xnu-deps/host/bin/dsymutil || true
          fi
          sed -i 's/DO_CTFMERGE=0/DO_CTFMERGE=0 BUILD_DSYM=0/' xnu-build.sh || true
          
          echo "=== Substituindo cctools strip por stub (cópia segura) ==="
          printf '#!/bin/bash\nin=""; out=""\nwhile [ $# -gt 0 ]; do\n  case "$1" in -o) out="$2"; shift 2 ;; -*) shift ;; *) [ -z "$in" ] && in="$1"; shift ;; esac\ndone\n[ -n "$in" ] && [ -n "$out" ] && cp "$in" "$out"\nexit 0\n' > /tmp/strip-stub.sh
          chmod +x /tmp/strip-stub.sh
          for s in xnu-deps/host/bin/strip "$HOME/theos/toolchain/linux/iphone/bin/strip"; do
            rm -f "$s" 2>/dev/null || true
            mkdir -p "$(dirname "$s")" 2>/dev/null || true
            cp /tmp/strip-stub.sh "$s"
            chmod +x "$s"
          done
          
          echo "=== Compilando kernel XNU para A51 ==="
          if ! make kernel BUILD_DSYM=0; then
            echo "=== ERRO NA COMPILACAO DO KERNEL ==="
            if [ -f xnu-build.log ]; then
              echo "--- Linhas com 'error:' em xnu-build.log ---"
              grep -E -C 3 "error:" xnu-build.log || true
              echo "--- Ultimas 100 linhas de xnu-build.log ---"
              tail -n 100 xnu-build.log
            fi
            exit 1
          fi

      - name: Build Flashboot Userland Image
        working-directory: hakios-tree
        run: |
          umask 022
          QUIET=1 GL=1 CRYPTEXES=flash FLASHBOOT=1 REST=1 userland/build.sh

      - name: Package Odin Recovery Image (.tar.md5)
        working-directory: hakios-tree
        run: |
          mkdir -p out
          PAYLOAD_ARG=""
          if [ -f hakios-kernel ]; then
            echo "=== Empacotando hakios-kernel em payload XNUP ==="
            python3 xnuloader/mkpayload.py -o out/payload.bin kernel=hakios-kernel || true
            if [ -f out/payload.bin ]; then
              PAYLOAD_ARG="-p out/payload.bin"
            fi
          fi
          
          echo "=== Gerando recovery.img com mkxnuimg.py ==="
          python3 mkxnuimg.py --device a51 $PAYLOAD_ARG -o out/recovery.img || python3 mkxnuimg.py --device a51 -o out/recovery.img || true
          
          if [ -f out/recovery.img ]; then
            cd out
            tar -H ustar -c recovery.img > hakios-a51-fb2-RECOVERY.tar
            md5sum -t hakios-a51-fb2-RECOVERY.tar >> hakios-a51-fb2-RECOVERY.tar
            mv hakios-a51-fb2-RECOVERY.tar hakios-a51-fb2-RECOVERY.tar.md5
            ls -lh hakios-a51-fb2-RECOVERY.tar.md5
            cd ..
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-a51-recovery-odin
          path: |
            hakios-tree/out/*
            hakios-tree/build/*
            hakios-tree/hakios-kernel
            hakios-tree/loader.efi
            hakios-tree/userland/*.apfs
          if-no-files-found: warn
