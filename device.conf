# devices/a51/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device a51
	title       Samsung Galaxy A51 (SM-A515F)
	vendor      Samsung
	soc         exynos9611
	defconfig   a51_defconfig
	maintainer  you
	status      storage     works     UEFI UFS: every partition is read (2026-11-12)
	status      usb         works     UEFI USB device mode: the loader's fastboot reaches the PC (2026-11-12)
	status      display     works     iOS 16.5 SpringBoard home screen on the phone, software rendering through the UEFI framebuffer (2026-11-13)
	status      cpu         works     XNU on all cores of both clusters (A53 + A73, GICv2, PSCI via a below-4GB trampoline), 2026-11-12; a core switched off does not restart until the next boot
	status      touch       works     Melfas MSS100 on I2C 0x13870000, hakios.a51input.c (touchscreen=1), 2026-11-13
	status      buttons     works     power and volume keys, gpa1 5/6/7, hakios.a51input.c (buttons=1 or with touchscreen=1), 2026-11-13
	status      gpu         partial   Mali-G72 MP3: the window server draws on it (Mesa 25 Panfrost, OpenGL ES 3.1), about 7.75 ms a frame; clocks raised through ACPM with a temperature watch (a51gpu=8 a51gpu_keep=1 a51gpu_clock=3; top levels a51cpu0_khz=1742000 a51cpu1_khz=2314000 a51gpu_mhz=1053), about 7.2 ms a frame, 2026-11-14
	status      wifi        partial   Samsung WLBT core and WLAN service started (hakios.a51wifi.c): firmware, CFG_REQ, MM_START_IND, HIP4, SM_MSG_START_CFM; passive scan (a51wifi=6); WPA2-Personal connect (a51wifi=7); Darwin's Wi-Fi with a51wifi=8: en0, wifid/Settings station side, DHCP, iOS online (42 MB in 3 min); fw/wifi.conf joined at boot, 2026-11-15
